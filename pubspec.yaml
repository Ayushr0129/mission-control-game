name: mission_control
description: An offline space programme engineering game. Beyond the Launch.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: ^1.30.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  audioplayers: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
